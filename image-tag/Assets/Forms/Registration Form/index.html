<!DOCTYPE html>
<html lang="en">

<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <form class="form-card">
        <h1>Registration Form</h1>
        <p class="sub">Fill in your details below.</p>

        <!-- Full Name field -->
        <div class="field">

            <!-- red vaneko danger colour so danger rakheko -->
            <label class="title">Full Name <span class="text-danger">*</span></label>
            <input type="text" id="full-name" placeholder="Enter your full name" required>

        </div>

        <!-- Password field -->
        <div class="field">

            <!-- red vaneko danger colour so danger rakheko -->
            <label class="title">Password <span class="text-danger">*</span></label>
            <input type="password" id="password" placeholder="Enter your password" required>

        </div>

        <!-- Address field -->
        <div class="field">

            <!-- red vaneko danger colour so danger rakheko -->
            <label class="title">Address <span class="text-danger">*</span></label>
            <input type="text" id="address" placeholder="Street, city, country" required>

        </div>

        <!-- District Field -->
        <div class="field">

            <!-- red vaneko danger colour so danger rakheko -->
            <label class="title">District <span class="text-danger">*</span></label>
            <select id="district" required>
                <option value="0" selected disabled>Select District</option>
                <option value="rupandehi">Rupandehi</option>
                <option value="bagmati">Bagmati</option>
                <option value="gandaki">Gandaki</option>
                <option value="jumla">Jumla</option>
            </select>
        </div>

        <!-- DOB Field -->
        <div class="field">

            <!-- red vaneko danger colour so danger rakheko -->
            <label class="title">Date of Birth <span class="text-danger">*</span></label>
            <input type="date" id="dob" required>

        </div>

        <!-- Gender Field-->
        <fieldset>
            <span class="legend">Gender <span class="text-danger">*</span></span>
            <div class="options">
                <label class="option">
                    <input type="radio" value="male" name="gender"> <span>Male</span>
                </label>

                <label class="option">
                    <input type="radio" value="female" name="gender"> <span>Female</span>
                </label>

            </div>
        </fieldset>

        <!-- Hobbies Field -->
        <fieldset>
            <span class="legend">Hobbies <span class="text-danger">*</span></span>
            <div class="options">

                <label class="option">
                    <input type="checkbox" value="cricket" name="sports"> <span>Cricket</span>
                </label>

                <label class="option">
                    <input type="checkbox" value="football" name="sports"> <span>Football</span>
                </label>

                <label class="option">
                    <input type="checkbox" value="volleyball" name="sports"> <span>Volleyball</span>
                </label>

                <label class="option">
                    <input type="checkbox" value="chess" name="sports"> <span>Chess</span>
                </label>

            </div>
        </fieldset>

        <!-- Message Field -->
        <div class="field">

            <!-- red vaneko danger colour so danger rakheko -->
            <label class="title">Message</label>
            <textarea id="message" rows="4" placeholder="Write your message here..."></textarea>

        </div>

        <!-- Buttons Field -->
        <div class="buttons">
            <button type="clear">Clear</button>
            <button type="submit">Submit</button>
        </div>

    </form>
</body>

</html>
